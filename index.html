<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Calculadora de IMC</title>
    <link rel="stylesheet" href="./styler.css" />
  </head>
  <body>
    <main>
      <figure class="doutor">
        <img
          src="Meio.png"
          alt="Doutor Iarley, médico Com a melhor aparência do mundo, sorrindo e com estetoscópio no pescoço."
        />
      </figure>

      <section class="calculadora">
        <div class="topo">
          <h1>Calcule seu <span>IMC</span></h1>
        </div>
        <p class="frase" id="frase"></p>

        <div class="linha">
          <div class="campo">
            <label for="peso">Peso (kg)</label>
            <input
              type="number"
              id="peso"
              placeholder="Ex.: 70"
              step="0.1"
              min="0"
            />
          </div>
          <div class="campo">
            <label for="altura">Altura (m)</label>
            <input
              type="number"
              id="altura"
              placeholder="Ex.: 1.75"
              step="0.01"
              min="0"
            />
          </div>
        </div>

        <div class="botoes">
          <button type="button" id="btnCalcular" onclick="calcularIMC()">
            Calcular IMC
          </button>
          <button type="button" id="btnLimpar" onclick="limpar()">
            Limpar
          </button>
        </div>

        <div id="resultado" aria-live="polite"></div>

        <div class="historico">
          <h2>Últimos cálculos</h2>
          <ul id="lista">
            <li
              class="vazio"
              style="border: none; background: none; padding: 0"
            >
              Nenhum cálculo ainda.
            </li>
          </ul>
        </div>
      </section>
    </main>

    <footer>Desenvolvido por: Iarley Gabriel</footer>

    <script src="./script.js"></script>
  </body>
</html>
